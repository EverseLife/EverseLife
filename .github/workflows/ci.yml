# Checks, image builds and alpha deployment.
#
# The order is the same for everyone: tests -> images -> server. Only what
# passed the tests goes to the server, and only from the main branch.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same branch cancels the previous run: no reason to keep
  # a queue of deployments.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The vault snapshot travels with the code: both tests and the image compute the world by it.
  OCTOVERSE_VAULT_BUILD: ${{ github.workspace }}/vault

jobs:
  backend:
    name: Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: octoverse
          POSTGRES_PASSWORD: octoverse
          POSTGRES_DB: octoverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U octoverse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      OCTOVERSE_DATABASE_URL: postgresql+asyncpg://octoverse:octoverse@localhost:5432/octoverse
      OCTOVERSE_MIGRATED_DATABASE_URL: postgresql+asyncpg://octoverse:octoverse@localhost:5432/octoverse
      OCTOVERSE_TEST_DATABASE_URL: postgresql+asyncpg://octoverse:octoverse@localhost:5432/octoverse_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Environment by lock
        run: uv sync --frozen --extra dev

      - name: Test database
        env:
          PGPASSWORD: octoverse
        run: psql -h localhost -U octoverse -d postgres -c 'CREATE DATABASE octoverse_test'

      - name: Lint
        run: uv run ruff check .

      - name: Migrations apply
        run: uv run alembic upgrade head

      # The full run is ~8 minutes: it is the main protection of the world from a wipe.
      - name: Tests
        run: uv run pytest -q

  # The snapshot in `vault/` is build output, not a file to edit. Hand edits
  # there look like a balance change and behave like a broken world: the engine
  # asks for numbers the vault never produced, and it surfaces a day later on
  # the live alpha. So the check is mechanical -- rebuild the vault from its
  # own sources and compare.
  vault:
    name: Vault snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The vault itself
        uses: actions/checkout@v4
        with:
          repository: sumrak10/octoverse-vault
          path: .vault-source

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml==6.0.2

      - name: Rebuild and compare
        run: |
          python .vault-source/tools/build.py
          if diff -ru .vault-source/build vault --exclude=README.md > /tmp/vault.diff; then
            echo "the snapshot matches the vault"
          else
            echo "::error::vault/*.json diverges from the vault -- numbers are edited in the vault, then carried over by deploy/sync-vault.py"
            head -40 /tmp/vault.diff
            exit 1
          fi

  frontend:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # Contrast of every text/background pair in every theme and lightness
      # (D-077). Five planets in two lights is 150 pairs -- not an eye's job.
      - run: npm run check:tokens
      # Decision codes live in comments, never in a line the player reads.
      - run: npm run check:copy
      - run: npm run build

  images:
    name: Images
    needs: [backend, frontend, vault]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The server context is the root: `vault/` goes into the image.
      - name: Server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/octoverse-backend:latest
            ghcr.io/${{ github.repository_owner }}/octoverse-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Client
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/octoverse-frontend:latest
            ghcr.io/${{ github.repository_owner }}/octoverse-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Landing
        uses: docker/build-push-action@v6
        with:
          context: landing
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/octoverse-landing:latest
            ghcr.io/${{ github.repository_owner }}/octoverse-landing:${{ github.sha }}
          cache-from: type=gha,scope=landing
          cache-to: type=gha,scope=landing,mode=max

  deploy:
    name: Deploy
    needs: images
    # Until the DEPLOY_ENABLED=true variable is set on Actions, the step is
    # silent: a fork and somebody's copy of the repo must not knock on somebody's server.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DIR: ${{ vars.DEPLOY_PATH || '/opt/octoverse' }}
      # The deploy channel webhook. Declared at job level because the step
      # checks it in its own `if`, and only `env` is visible there.
      DISCORD_HOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - name: Key and known hosts
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Weaker: the fingerprint is taken from the server itself. Fine for
            # the first time; afterwards put it into the DEPLOY_KNOWN_HOSTS secret.
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      # The compose file and edge settings are edited in the repository, not on
      # the server. `.env` with passwords stays untouched: nobody puts it there.
      - name: Ship the compose file
        run: |
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" -r \
            deploy/compose.yaml deploy/Caddyfile deploy/prometheus.yml deploy/grafana \
            "$SSH_USER@$SSH_HOST:$DIR/"

      # The script goes to the server as stdin, not as a command line: the
      # registry token must not show in the process list of somebody's machine.
      # It lives exactly this run -- nothing settles on the server.
      - name: Bring up
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s <<REMOTE
          set -euo pipefail
          cd "$DIR"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose pull
          # The schema is applied by the migrate service before the server
          # starts; nothing needs bringing up by hand.
          docker compose up -d --remove-orphans
          docker logout ghcr.io
          docker image prune -f
          docker compose ps
          REMOTE

      - name: Server responds
        if: vars.DEPLOY_DOMAIN != ''
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://${{ vars.DEPLOY_DOMAIN }}/api/health" > /dev/null; then
              echo "alive"; exit 0
            fi
            sleep 5
          done
          echo "the server did not answer on /api/health"; exit 1

      # The deploy result goes to the community channel. Without the secret the
      # step is silent: somebody's copy of the repo must not knock on somebody's
      # Discord. `always()` -- so that failure is reported too, otherwise the channel would lie by silence.
      - name: Tell Discord
        if: always() && env.DISCORD_HOOK != ''
        env:
          STATUS: ${{ job.status }}
          DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          if [ "$STATUS" = "success" ]; then
            LINE="✅ Альфа обновлена: \`$SHORT\`"
            # A separate `if`, not `&&`: the step runs under `bash -e`, and an
            # empty domain would fail it right here, sending nothing.

            if [ -n "$DOMAIN" ]; then
              LINE="$LINE — https://$DOMAIN"
            fi
          else
            LINE="❌ Выкладка не удалась на \`$SHORT\`. Журнал: $RUN_URL"
          fi
          jq -n --arg content "$LINE" \
            '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS -H 'Content-Type: application/json' -d @- "$DISCORD_HOOK" > /dev/null
