# Checks, image builds and alpha deployment.
#
# The order is the same for everyone: tests -> images -> server. Only what
# passed the tests goes to the server, and only from the main branch.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same branch cancels the previous run: no reason to keep
  # a queue of deployments.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Where the numbers land once a job builds them. They are not stored in
  # this repository: `.github/actions/vault` fetches the vault and builds them.
  EVERSELIFE_VAULT_BUILD: ${{ github.workspace }}/vault

jobs:
  backend:
    name: Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: everselife
          POSTGRES_PASSWORD: everselife
          POSTGRES_DB: everselife
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U everselife"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      EVERSELIFE_DATABASE_URL: postgresql+asyncpg://everselife:everselife@localhost:5432/everselife
      EVERSELIFE_MIGRATED_DATABASE_URL: postgresql+asyncpg://everselife:everselife@localhost:5432/everselife
      EVERSELIFE_TEST_DATABASE_URL: postgresql+asyncpg://everselife:everselife@localhost:5432/everselife_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # The numbers are built here, not stored in the repository.
      - uses: ./.github/actions/vault

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Environment by lock
        run: uv sync --frozen --extra dev

      - name: Test database
        env:
          PGPASSWORD: everselife
        run: psql -h localhost -U everselife -d postgres -c 'CREATE DATABASE everselife_test'

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      #: Layers `api -> engine -> models -> constants`, no import upward
      #: (review 2026-08-23; contract in pyproject.toml).
      - name: Layers
        run: uv run lint-imports

      #: No new Russian written into the engine's own source (D-251). A
      #: ratchet: what is still there is listed in the script with its reason,
      #: and the numbers only go down. `tools/check_copy.py` decides, not this
      #: file.
      - name: Copy
        run: uv run python tools/check_copy.py

      #: Every language says what the default one says: same messages, same
      #: arguments, same functions and enum branches (D-251 wave V). The pytest
      #: suite only compares key sets; a `NAME($goods)` degraded to `{ $goods }`
      #: in the English file passes it -- this is the check that sees it.
      - name: Locales
        run: uv run python tools/check_locales.py

      #: The window's own words, by the same script and the same rule: a new
      #: panel string added to `ru` and forgotten in `en` falls back to Russian
      #: and shows an English player a Russian button -- silently, because the
      #: fallback is there for a language nobody has started, not for a hole in
      #: one that exists. Checked from here because the Fluent parser lives in
      #: this environment; the client's job has no python.
      - name: Locales of the client
        run: uv run python tools/check_locales.py --tree ../frontend/src/locales

      - name: Migrations apply
        run: uv run alembic upgrade head

      # The main protection of the world from a wipe, and it must stay cheap
      # enough to run on every push. Four workers, each with a database of its
      # own -- `tests/conftest.py` creates them.
      - name: Tests
        run: uv run pytest -q -n 4

  frontend:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      #: The pure modules (clock, amounts, arrange, tiers) -- the first tests
      #: the client had (review 2026-08-23).
      - run: npm test
      # Contrast of every text/background pair in every theme and lightness
      # (D-077). Five planets in two lights is 150 pairs -- not an eye's job.
      - run: npm run check:tokens
      # Decision codes live in comments, never in a line the player reads --
      # and since D-251 wave IV, neither does Russian: every sentence the
      # window shows lives in src/locales/*.ftl.
      - run: npm run check:copy
      - run: npm run build

  licence:
    name: Licence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pure standard library, so no environment to build: the runner's python
      # is enough. `tools/spdx.py` decides what is covered, not this file.
      - name: Licence header in every source file
        run: python3 tools/spdx.py

  tools:
    name: Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # The root `tools/` has no environment of its own -- the scripts are
      # standard library on purpose, so they run on any machine that has
      # python. Lint borrows the server's ruleset instead of inventing a
      # second one; without this the folder was covered by nothing, and the
      # monitor shipped with a defect ruff would have named.
      - run: uvx ruff check --config backend/pyproject.toml tools
      - run: uvx ruff format --check --config backend/pyproject.toml tools
      - run: uvx pytest -q tools

  landing:
    name: Landing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # The landing has no environment of its own either -- two dependencies
      # and the standard library. Its tests pin what a deploy must not lose
      # quietly: every page served, the sitemap, both languages pointing at
      # each other, and now the counter -- that no address is stored, that a
      # stranger's URL cannot invent Prometheus series, and that a broken
      # database never reaches the reader. None of that shows on the page, so
      # nothing but a test can say it broke.
      # Lint borrows the server's ruleset, like `tools` does -- but through
      # `landing/ruff.toml` rather than `--config`, which would bypass it. The
      # file adds one setting the server's copy cannot give from here: which
      # imports are ours. Without it `app` and `stats` sorted one way under
      # this job and another way for anyone linting from the repository root,
      # so a run in the wrong folder produced a "fix" that fails here.
      #
      # Only `check`: `format` would rewrite files this change never touched,
      # and a wholesale reformat is its own commit, not a rider on this one.
      - run: uvx ruff check .

      # The two dependencies arrive as an overlay over one command, not as an
      # install. `uv pip install --system` aimed at the runner's Debian python,
      # which is marked externally managed (PEP 668) and refuses -- so this job
      # never once ran its tests. `uv run --with` builds the environment in
      # uv's cache, the way `uvx` above does, and leaves no venv beside the
      # sources for .gitignore to learn about.
      - run: uv run --no-project --with-requirements requirements.txt --with pytest --with httpx pytest -q test_app.py
        env:
          LANDING_DB: ./ci-signups.db

  agents:
    name: Agents
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic_player_system
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      #: The reference test compares against the server's registry through
      #: the backend venv; without one it skips, the rest runs.
      - run: uv run pytest -q

  images:
    name: Images
    needs: [backend, frontend, agents, licence]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The server image carries the numbers inside, so they are built before it.
      - uses: ./.github/actions/vault

      # GHCR does not accept capital letters in the name, and our owner is
      # `EverseLife`. Lowercase it once here, so that the tags are built from
      # a ready value rather than from a filter expression in every image.
      - name: Owner in lowercase
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The server context is the root: `vault/` goes into the image.
      - name: Server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          # The revision goes inside the image, not only into its tag: a
          # running server has to be able to say which source it came from.
          build-args: |
            RELEASE=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.OWNER }}/everselife-backend:latest
            ghcr.io/${{ env.OWNER }}/everselife-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Client
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          # The same revision as the server's: the link in the header must
          # point at the commit this client was built from.
          build-args: |
            RELEASE=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.OWNER }}/everselife-frontend:latest
            ghcr.io/${{ env.OWNER }}/everselife-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Landing
        uses: docker/build-push-action@v6
        with:
          context: landing
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/everselife-landing:latest
            ghcr.io/${{ env.OWNER }}/everselife-landing:${{ github.sha }}
          cache-from: type=gha,scope=landing
          cache-to: type=gha,scope=landing,mode=max

      - name: Agents
        uses: docker/build-push-action@v6
        with:
          # Built from the root: the image freezes backend/src/api/session.py
          # as the protocol reference of the same revision.
          context: .
          file: agentic_player_system/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/everselife-agents:latest
            ghcr.io/${{ env.OWNER }}/everselife-agents:${{ github.sha }}
          cache-from: type=gha,scope=agents
          cache-to: type=gha,scope=agents,mode=max

  deploy:
    name: Deploy
    needs: images
    # Until the DEPLOY_ENABLED=true variable is set on Actions, the step is
    # silent: a fork and somebody's copy of the repo must not knock on somebody's server.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DIR: ${{ vars.DEPLOY_PATH || '/opt/everselife' }}
      # The deploy channel webhook. Declared at job level because the step
      # checks it in its own `if`, and only `env` is visible there.
      DISCORD_HOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - name: Key and known hosts
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Weaker: the fingerprint is taken from the server itself. Fine for
            # the first time; afterwards put it into the DEPLOY_KNOWN_HOSTS secret.
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      # The compose file and edge settings are edited in the repository, not on
      # the server. `.env` with passwords stays untouched: nobody puts it there.
      - name: Ship the compose file
        run: |
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" -r \
            deploy/compose.yaml deploy/Caddyfile deploy/prometheus.yml deploy/grafana \
            "$SSH_USER@$SSH_HOST:$DIR/"

      # The script goes to the server as stdin, not as a command line: the
      # registry token must not show in the process list of somebody's machine.
      # It lives exactly this run -- nothing settles on the server.
      - name: Bring up
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s <<REMOTE
          set -euo pipefail
          cd "$DIR"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose pull
          # The schema is applied by the migrate service before the server
          # starts; nothing needs bringing up by hand.
          docker compose up -d --remove-orphans
          docker logout ghcr.io
          docker image prune -f
          docker compose ps
          REMOTE

      - name: Server responds
        if: vars.DEPLOY_DOMAIN != ''
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://${{ vars.DEPLOY_DOMAIN }}/api/health" > /dev/null; then
              echo "alive"; exit 0
            fi
            sleep 5
          done
          echo "the server did not answer on /api/health"; exit 1

      # The deploy result goes to the community channel. Without the secret the
      # step is silent: somebody's copy of the repo must not knock on somebody's
      # Discord. `always()` -- so that failure is reported too, otherwise the channel would lie by silence.
      - name: Tell Discord
        if: always() && env.DISCORD_HOOK != ''
        env:
          STATUS: ${{ job.status }}
          DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          if [ "$STATUS" = "success" ]; then
            LINE="✅ Альфа обновлена: \`$SHORT\`"
            # A separate `if`, not `&&`: the step runs under `bash -e`, and an
            # empty domain would fail it right here, sending nothing.

            if [ -n "$DOMAIN" ]; then
              LINE="$LINE — https://$DOMAIN"
            fi
          else
            LINE="❌ Выкладка не удалась на \`$SHORT\`. Журнал: $RUN_URL"
          fi
          jq -n --arg content "$LINE" \
            '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sS -H 'Content-Type: application/json' -d @- "$DISCORD_HOOK" > /dev/null

  deploy-landing:
    name: Deploy landing
    needs: images
    # For a landing on its own host, which is not how it is deployed today: it
    # rides the game host's deploy (deploy/compose.landing.yaml says why the
    # split was tried and undone). So this job is normally silent -- and stays
    # silent until the LANDING_DEPLOY_ENABLED=true variable is set on Actions,
    # same rule as the main deploy: a fork must not knock on somebody's server.
    if: vars.LANDING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.LANDING_DEPLOY_HOST }}
      SSH_USER: ${{ secrets.LANDING_DEPLOY_USER }}
      SSH_PORT: ${{ secrets.LANDING_DEPLOY_PORT || '22' }}
      DIR: ${{ vars.LANDING_DEPLOY_PATH || '/opt/everselife-landing' }}
    steps:
      - uses: actions/checkout@v4

      # The same admin key as the game host: one person, one key.
      - name: Key and known hosts
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LANDING_DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Weaker: the fingerprint is taken from the server itself. Fine for
            # the first time; afterwards put it into the secret.
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Ship the compose file
        run: |
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" \
            deploy/compose.landing.yaml deploy/Caddyfile.landing \
            "$SSH_USER@$SSH_HOST:$DIR/"

      # The script goes to the server as stdin, not as a command line: the
      # registry token must not show in the process list of somebody's machine.
      - name: Bring up
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s <<REMOTE
          set -euo pipefail
          cd "$DIR"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose -f compose.landing.yaml pull
          docker compose -f compose.landing.yaml up -d --remove-orphans
          docker logout ghcr.io
          docker image prune -f
          docker compose -f compose.landing.yaml ps
          REMOTE

      - name: Landing responds
        if: vars.LANDING_DOMAIN != ''
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://${{ vars.LANDING_DOMAIN }}/" > /dev/null; then
              echo "alive"; exit 0
            fi
            sleep 5
          done
          echo "the landing did not answer"; exit 1
