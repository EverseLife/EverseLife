# Разработка: база под сервер и тесты, ничего больше.
# Боевой состав — `deploy/compose.yaml`, порядок выкладки — `DEPLOY.md`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: octoverse
      POSTGRES_PASSWORD: octoverse
      POSTGRES_DB: octoverse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octoverse"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
