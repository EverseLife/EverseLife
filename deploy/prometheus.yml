# What is collected and how often. Nothing is published outside: the exporters
# are reachable only over the compose network, by service name.

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  external_labels:
    server: alpha

scrape_configs:
  # The host: processor, memory, free disk space, network.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Containers one by one.
  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]

  # The game database.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # The landing: who came, from where, and how far they got. The landing counts
  # this itself, in its own SQLite, because a counter that lives in somebody
  # else's script costs the visitor a cross-border request -- which is why the
  # Google one was taken off the page. The exposition is a view over those rows,
  # so a scrape is one query and the numbers survive a restart.
  - job_name: landing
    static_configs:
      - targets: ["landing:8080"]

  # Prometheus watching itself: without it a stopped collector looks like
  # silence rather than a failure.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
