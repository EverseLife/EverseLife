# The alpha's production compose. Lives on the server in `/opt/everselife`.
#
#   docker compose pull && docker compose up -d
#
# Only Caddy (80/443) faces outside: it obtains the Let's Encrypt certificate,
# serves the client and proxies `/api` to the game server. The database
# publishes no ports -- it is reached over the compose internal network.
#
# The `backend`, `worker` and `migrate` roles are one and the same image: the
# engine and its worker may not diverge in version.

name: everselife

x-server: &server
  image: ghcr.io/${GHCR_OWNER:-everselife}/everselife-backend:${TAG:-latest}
  environment:
    EVERSELIFE_DATABASE_URL: postgresql+asyncpg://everselife:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/everselife
    EVERSELIFE_VAULT_BUILD: /vault
    EVERSELIFE_LOG_LEVEL: ${EVERSELIFE_LOG_LEVEL:-INFO}
    EVERSELIFE_JOB_BATCH: ${EVERSELIFE_JOB_BATCH:-64}
    #: Jobs the worker runs at once: the ticks are many small jobs (wave 4).
    EVERSELIFE_JOB_CONCURRENCY: ${EVERSELIFE_JOB_CONCURRENCY:-4}
    #: How many database connections **one process** keeps. A session command
    #: holds a connection for its whole transaction, so this is the number of
    #: players served at the same instant. Every `--workers` process holds a
    #: pool of its own: four servers plus the worker is five pools, and their
    #: sum must stay under the database's `max_connections` below. Each server
    #: process also holds **one** connection outside its pool for the journal's
    #: LISTEN (D-226), and the worker runs `EVERSELIFE_JOB_CONCURRENCY` jobs at
    #: once from its pool. Budget: servers x (pool + overflow + 1) + worker
    #: (pool + overflow) + migrate + seed < max_connections. Past ~8 server
    #: processes put PgBouncer (transaction pooling) in front and set
    #: `statement_cache_size=0` on asyncpg.
    EVERSELIFE_DB_POOL_SIZE: ${EVERSELIFE_DB_POOL_SIZE:-10}
    EVERSELIFE_DB_MAX_OVERFLOW: ${EVERSELIFE_DB_MAX_OVERFLOW:-5}
    #: The world chronicle to Discord (`src/herald/`). Empty -- the herald is
    #: silent; the feed goes out, nothing comes in from Discord.
    EVERSELIFE_DISCORD_WEBHOOK: ${EVERSELIFE_DISCORD_WEBHOOK:-}
    #: The client is opened by its own domain -- only it is let into the session.
    EVERSELIFE_ALLOWED_ORIGINS: '["https://${DOMAIN:?DOMAIN is required}"]'
    #: The local-network address pattern from development is not needed in
    #: production: `^$` matches no origin. The double dollar is how compose
    #: writes a literal dollar; `^$` reaches the server.
    EVERSELIFE_ALLOWED_ORIGIN_REGEX: '^$$'
    #: The alpha's debug widget (D-229): identity names as JSON. `[]` -- for
    #: nobody, and that is the right value everywhere the alpha is not being
    #: tested by its own developers. It spawns matter and finishes work out of
    #: turn, so it is switched on deliberately rather than switched off later.
    EVERSELIFE_ADMINS: ${EVERSELIFE_ADMINS:-[]}
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    # The default hundred connections is not enough once the server runs in
    # several processes: four servers and the worker hold `pool_size +
    # max_overflow` each, and a deploy adds `migrate` and `seed` on top. A
    # connection at rest costs a couple of megabytes, so the ceiling is raised
    # with room to spare rather than counted to the last one.
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    environment:
      POSTGRES_USER: everselife
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: everselife
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everselife -d everselife"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # The schema is applied before the server starts and exactly once per deploy:
  # the world is eternal, no wipes (D-007), and a schema/code divergence cannot be fixed.
  migrate:
    <<: *server
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The starting world, and then keeping it up to date. Content is not schema,
  # so it does not belong in a migration (`catch_up` in `src/seed.py` says why):
  # a migration runs once in the history of a database, while the world layout
  # changes with the vault. Running it again creates nothing twice -- every step
  # checks first -- so it runs on every deploy and nobody has to remember it.
  seed:
    <<: *server
    command: ["python", "-m", "src.seed"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    healthcheck:
      disable: true

  backend:
    <<: *server
    # One process is one processor core, whatever the server has: Python holds
    # the interpreter lock, and a load test showed the ceiling standing still
    # at 150 players whether six cores were given or thirty-two. Four processes
    # on six cores moved it past 300; the two cores left over are not spare,
    # they are the worker's and the database's.
    #
    # `--proxy-headers` and the CMD's other arguments are repeated here on
    # purpose: a compose `command` replaces the image's command whole, and
    # without them the player's real address would be lost behind Caddy.
    command: ["uvicorn", "src.api.app:app",
              "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*",
              "--workers", "${EVERSELIFE_WEB_WORKERS:-4}"]
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  # Without the worker the world stands: long-running jobs (tick, batches, roads) are driven by it.
  worker:
    <<: *server
    command: ["python", "-m", "src.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    #: The worker beats a file on every pass; a beat older than two minutes
    #: is a stuck worker, and without the worker the world stands still.
    healthcheck:
      #: The double dollar is how compose writes a literal one: the shell in
      #: the container must see `$(find …)`, not an interpolation attempt.
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/everselife-worker.beat -mmin -2 2>/dev/null)\""]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    image: ghcr.io/${GHCR_OWNER:-everselife}/everselife-frontend:${TAG:-latest}
    restart: unless-stopped

  # The everse.life landing: the page and beta signup intake. Signups go
  # to SQLite on a volume; the landing does not touch the game database. Until
  # LANDING_DOMAIN is set in `.env`, Caddy keeps it on an internal name and does not expose it.
  landing:
    image: ghcr.io/${GHCR_OWNER:-everselife}/everselife-landing:${TAG:-latest}
    environment:
      #: The service channel: "one more signup came, so many in total". The
      #: applicant's email does not go there and must not.
      LANDING_DISCORD_WEBHOOK: ${LANDING_DISCORD_WEBHOOK:-}
    volumes:
      - landing_data:/data
    restart: unless-stopped

  # AI citizens (D-224): the agents panel and runner. Agents play through
  # backend's ordinary /session/ws; the panel is its own domain (AGENTS_DOMAIN)
  # behind the admin login from `.env`. Until AGENTS_DOMAIN is set, Caddy keeps
  # it on an internal name and does not expose it.
  agents:
    image: ghcr.io/${GHCR_OWNER:-everselife}/everselife-agents:${TAG:-latest}
    environment:
      APS_GAME_URL: http://backend:8000
      APS_ADMIN_LOGIN: ${AGENTS_ADMIN_LOGIN:-admin}
      APS_ADMIN_PASSWORD: ${AGENTS_ADMIN_PASSWORD:-}
      APS_LLM_BASE_URL: ${AGENTS_LLM_BASE_URL:-https://api.deepseek.com/v1}
      APS_LLM_MODEL: ${AGENTS_LLM_MODEL:-deepseek-chat}
      APS_LLM_API_KEY: ${AGENTS_LLM_API_KEY:-}
      #: Seals the agents' game passwords and the provider key in the
      #: store (`aps/secrets.py`): without it a backup of the volume is
      #: those secrets in the clear. Rotates by listing the new key first.
      APS_SECRET_KEY: ${AGENTS_SECRET_KEY:-}
      APS_LOG_LEVEL: ${EVERSELIFE_LOG_LEVEL:-INFO}
    volumes:
      - agents_data:/data
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      LANDING_DOMAIN: ${LANDING_DOMAIN:-landing.localhost}
      AGENTS_DOMAIN: ${AGENTS_DOMAIN:-agents.localhost}
      #: Old domains that now only redirect to the landing (comma separated).
      LEGACY_DOMAINS: ${LEGACY_DOMAINS:-legacy.localhost}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates survive container recreation: Let's Encrypt has an
      # issuance limit, and losing them on every deploy is not allowed.

      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
      - landing
      - agents
    restart: unless-stopped

  # --- Watching the server -------------------------------------------------
  #
  # Nothing here faces outside: Grafana listens on the server's loopback only,
  # and it is opened through an SSH tunnel (see DEPLOY.md, "Monitoring"). The
  # exporters are not published at all -- Prometheus reaches them over the
  # compose network.

  # The host itself: processor, memory, free disk space, network. Reads the
  # real /proc and /sys, hence the mounts and `pid: host`.
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      # Container filesystems are cAdvisor's business; here only real disks.
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Plain `ro` on purpose: with `rslave` the container refuses to start
      # where the root mount is not shared, and a watching service must never
      # be the reason a deploy fails.
      - /:/host/root:ro
    pid: host
    restart: unless-stopped

  # Every container separately: who eats the memory, who keeps restarting.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=false
      # Series nobody looks at cost memory in Prometheus and in cAdvisor
      # itself; on a small server that is the difference between a
      # hundred megabytes and half a gigabyte.
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,hugetlb,referenced_memory,cpu_topology,resctrl,process
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      # The socket by name, not just through /var/run: without it cAdvisor
      # sees one root cgroup instead of the containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    restart: unless-stopped

  # The database: connections, size, long queries. Reads statistics only.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      # The password goes in its own variable, not inside a URL: a generated
      # password with `/` or `=` breaks the exporter's strict URL parser.
      DATA_SOURCE_URI: postgres:5432/everselife?sslmode=disable
      DATA_SOURCE_USER: everselife
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Collects and keeps. The depth of history is disk: roughly a gigabyte or
  # two for a fortnight at this scale.
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  # Dashboards and alerts. The port is bound to the server's loopback: from
  # outside there is nothing to knock on, one goes in through an SSH tunnel.
  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      #: The default is `admin`, and it is worth changing in `.env` even behind
      #: a tunnel: the server is not only yours to reach.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      #: The alert channel. An empty string is not allowed here: Grafana
      #: refuses to start on a contact point without a URL, and a watching
      #: service must never be the reason a deploy fails. So unset means a
      #: deliberately dead address -- alerts fire, are visible in the
      #: interface, and reach nobody.
      GRAFANA_DISCORD_WEBHOOK: ${GRAFANA_DISCORD_WEBHOOK:-http://127.0.0.1:1/discord-webhook-not-set}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  landing_data:
  agents_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
