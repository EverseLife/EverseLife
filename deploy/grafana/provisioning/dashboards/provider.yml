# Dashboards come from files, not from the database: what lies in the
# repository is what is on the screen, and an accidental edit does not become
# the source of truth.
apiVersion: 1

providers:
  - name: everselife
    orgId: 1
    folder: everse.life
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
