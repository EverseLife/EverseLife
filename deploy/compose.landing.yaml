# The landing on its own host, away from the game.
#
# Why apart: the game's addresses at Contabo turned out to be filtered for a
# share of Russian home networks by lists nobody publishes, and the landing is
# the acquisition funnel -- the one page that must open for a stranger. So it
# lives on an address picked for reachability (Timeweb EU, checked against the
# lists and probed from Russia before this file was written), while the game
# stays where it is until the address proves itself. The landing was built for
# this split: its own SQLite on its own volume, not one query into the game.
#
# Bring-up and the transfer of signups: DEPLOY.md, "Лендинг на своём хосте".
#
# `.env` next to this file needs LANDING_DOMAIN and ACME_EMAIL; the rest has
# working defaults. The image comes from GHCR -- CI builds it, nothing is
# built here.

services:
  landing:
    image: ghcr.io/${GHCR_OWNER:-everselife}/everselife-landing:${TAG:-latest}
    environment:
      #: The service channel: "one more signup came, so many in total". The
      #: applicant's email does not go there and must not.
      LANDING_DISCORD_WEBHOOK: ${LANDING_DISCORD_WEBHOOK:-}
      #: IndexNow: proves the site to Bing and Yandex, and lets
      #: `python indexnow.py` tell them a page changed. Empty -- the key route
      #: is not registered and the landing is exactly as it was.
      LANDING_INDEXNOW_KEY: ${LANDING_INDEXNOW_KEY:-}
    volumes:
      - landing_data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    #: No 443/udp on purpose: HTTP/3 is off in the Caddyfile (Russian
    #: providers filter UDP/443 widely), so there is nothing to publish.
    ports:
      - "80:80"
      - "443:443"
    environment:
      LANDING_DOMAIN: ${LANDING_DOMAIN:?LANDING_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./Caddyfile.landing:/etc/caddy/Caddyfile:ro
      # Certificates survive container recreation: Let's Encrypt has an
      # issuance limit, and losing them on every deploy is not allowed.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - landing
    restart: unless-stopped

volumes:
  landing_data:
  caddy_data:
  caddy_config:
