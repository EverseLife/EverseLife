[project]
name = "agentic-player-system"
version = "0.0.1"
description = "Everse.Life AI citizens: LLM agents that play through the ordinary client protocol (D-224)"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.9",
    # The device fee (D-110): the agent computes it exactly like the client.
    "argon2-cffi>=23.1",
    # Secrets at rest (aps/secrets.py): passwords and the provider key sealed
    # with APS_SECRET_KEY.
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aps"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
