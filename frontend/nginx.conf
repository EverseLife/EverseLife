# Serving the built client. TLS and the `/api` route are Caddy's business at
# the edge; an already decrypted request for static files arrives here.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A single-page application: any path leads to index.html, otherwise a
    # page refresh on an inner address gives 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Build file names contain a content fingerprint -- they can be cached
    # forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # But index.html must not be cached: it is what hands out the new file names.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Housekeeping for the container liveness check.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
