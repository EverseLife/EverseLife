# Отдача собранного клиента. TLS и маршрут `/api` — забота Caddy на границе,
# сюда приходит уже расшифрованный запрос за статикой.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Приложение одностраничное: любой путь ведёт в index.html, иначе
    # обновление страницы на внутреннем адресе даёт 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Имена файлов сборки содержат отпечаток содержимого — кэшировать можно
    # навечно.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # А вот index.html кэшировать нельзя: он и раздаёт новые имена файлов.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Служебное для проверки живости контейнера.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
