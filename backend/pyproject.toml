[project]
name = "everselife-server"
version = "0.0.1"
description = "Everse.Life game server"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "arq>=0.26",
    "orjson>=3.10",
    # Device fee: the server verifies the same estimate the client computes (D-112).
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    # `pytest -n 8`: the suite is a run against a database, and the database is
    # the wait. Each worker gets a database of its own (see tests/conftest.py).
    "pytest-xdist>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole run instead of one per test. Without it the
# engine could not be shared between tests: an asyncpg connection belongs to the
# loop that opened it, so every test would pay some seventy milliseconds to
# connect again -- several times over.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = ["error::DeprecationWarning:src.*"]

[tool.ruff]
line-length = 100
src = [".", "tests"]
# The migration body is generated by Alembic -- reformatting it means diverging
# from what will be generated next time.

extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
