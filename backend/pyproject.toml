[project]
name = "everselife-server"
version = "0.0.1"
description = "everse.life game server"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "arq>=0.26",
    "orjson>=3.10",
    # Device fee: the server verifies the same estimate the client computes (D-112).
    "argon2-cffi>=23.1",
    "fluent-runtime>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    # `pytest -n 8`: the suite is a run against a database, and the database is
    # the wait. Each worker gets a database of its own (see tests/conftest.py).
    "pytest-xdist>=3.6",
    # Layers `api -> engine -> models -> constants` and no import cycles: checked,
    # not hoped for (review 2026-08-23).
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole run instead of one per test. Without it the
# engine could not be shared between tests: an asyncpg connection belongs to the
# loop that opened it, so every test would pay some seventy milliseconds to
# connect again -- several times over.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = ["error::DeprecationWarning:src.*"]

[tool.ruff]
line-length = 100
src = [".", "tests"]
# The migration body is generated by Alembic -- reformatting it means diverging
# from what will be generated next time.

# `.claude/worktrees/<name>/` is a whole scratch copy of the repository that
# a parallel session works in. Walking into one means linting somebody
# else's half-finished edit, and reporting it as this tree's problem.
extend-exclude = ["migrations/versions", ".claude/worktrees"]

[tool.ruff.lint]
#: PLC0415 -- an import inside a function hides a cycle (348 of them before
#: the review of 2026-08-23). The ones that remain are marked `noqa` with
#: the cycle they break; a new one needs the same justification.
select = ["E", "F", "I", "UP", "B", "SIM", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
#: Tests import what they need where they need it; the cycle rule is for `src`.
"tests/**" = ["PLC0415"]
"migrations/**" = ["PLC0415"]
"tools/**" = ["PLC0415"]

[tool.importlinter]
root_package = "src"
# The review of 2026-08-23 counted 348 lazy imports and 29 mutual cycles in
# `src.engine`. The layers contract is enforced now; the cycle contract for the
# engine is the goal of wave 3 and stays commented until the cycles are broken.
[[tool.importlinter.contracts]]
name = "Layers: api -> engine -> models -> constants -> i18n"
type = "layers"
layers = ["src.api", "src.engine", "src.models", "src.constants", "src.i18n"]

# The city, cut out of a 1084-line `polity.py` that held founding, offices,
# code-laws and citizenship at once and let all four reach into each other.
# The cut only means something if it cannot silently grow back: without this
# the stack lives in four module docstrings, and a docstring does not fail a
# build.
#
# `forbidden` and not `layers`, and `allow_indirect_imports` on purpose. The
# package still sits inside two cycles it did not create -- `city -> travel ->
# city` and `city -> vote -> city`, both wave-3 leftovers -- so every pair of
# city modules is reachable from every other the long way round, and a layers
# contract would fail on chains that have nothing to do with this cut. What is
# checked here is the thing the cut actually established: which module may name
# which **directly**. Turn these into a layers contract on the day the engine's
# own cycles are gone.
[[tool.importlinter.contracts]]
name = "The city is a stack, and its floor asks nobody"
type = "forbidden"
source_modules = ["src.engine.city.hall"]
forbidden_modules = [
    "src.engine.city.office",
    "src.engine.city.law",
    "src.engine.city.citizen",
    "src.engine.city.land",
    "src.engine.city.founding",
]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "Offices know nothing of laws, citizens or founding"
type = "forbidden"
source_modules = ["src.engine.city.office"]
forbidden_modules = [
    "src.engine.city.law",
    "src.engine.city.citizen",
    "src.engine.city.land",
    "src.engine.city.founding",
]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "A law does not ask who is a citizen"
type = "forbidden"
source_modules = ["src.engine.city.law"]
forbidden_modules = [
    "src.engine.city.citizen",
    "src.engine.city.land",
    "src.engine.city.founding",
]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "Citizenship and land come before founding, not after"
type = "forbidden"
source_modules = ["src.engine.city.citizen", "src.engine.city.land"]
forbidden_modules = ["src.engine.city.founding"]
allow_indirect_imports = "true"

# The market, cut out of a 1636-line `market.py` that held the vocabulary, the
# terminal cells, the matching, the entrances and the book reading at once.
# Same shape as the city contracts, and `forbidden` for the same reason: the
# market sits inside engine cycles it did not create -- `craft` reaches back
# into it lazily, and its own door to `frost` is lazy -- so a layers contract
# would fail on chains that have nothing to do with this cut. The stack it
# pins directly: deal -> match -> counter -> _base, window -> _base.
[[tool.importlinter.contracts]]
name = "The market's vocabulary asks nobody"
type = "forbidden"
source_modules = ["src.engine.market._base"]
forbidden_modules = [
    "src.engine.market.counter",
    "src.engine.market.match",
    "src.engine.market.deal",
    "src.engine.market.window",
]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "The counter moves stacks and knows nothing of orders crossing"
type = "forbidden"
source_modules = ["src.engine.market.counter"]
forbidden_modules = [
    "src.engine.market.match",
    "src.engine.market.deal",
    "src.engine.market.window",
]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "Matching serves the entrances, never calls them"
type = "forbidden"
source_modules = ["src.engine.market.match"]
forbidden_modules = ["src.engine.market.deal", "src.engine.market.window"]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "The shop window only reads"
type = "forbidden"
source_modules = ["src.engine.market.window"]
forbidden_modules = [
    "src.engine.market.counter",
    "src.engine.market.match",
    "src.engine.market.deal",
]
allow_indirect_imports = "true"

# The face, cut out of a 931-line `mining.py` that held the formulas, the
# shift commands and the collapse at once. Same shape as the market contracts,
# and `forbidden` for the same reason: mining sits inside engine cycles it did
# not create -- `death` reaches back into it lazily, `rig` borrows its
# depletion rule lazily -- so a layers contract would fail on chains that have
# nothing to do with this cut. The stack it pins directly:
# face -> collapse -> _base.
[[tool.importlinter.contracts]]
name = "The mining vocabulary asks nobody"
type = "forbidden"
source_modules = ["src.engine.mining._base"]
forbidden_modules = [
    "src.engine.mining.face",
    "src.engine.mining.collapse",
]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "A collapse ends a shift and never opens one"
type = "forbidden"
source_modules = ["src.engine.mining.collapse"]
forbidden_modules = ["src.engine.mining.face"]
allow_indirect_imports = "true"

# The eruptions, cut out of an 814-line `plates.py` that held the job chain,
# the fire, the map redraw and the vein moves at once. Same shape and same
# `forbidden` reasoning as the city and the market: plates sits inside engine
# cycles it did not create (`veins` reaches into `mining` lazily, `ways` into
# `death`, and both reach back), so a layers contract would fail on chains
# that have nothing to do with this cut. The stack it pins directly:
# clock -> {fire, ways, veins} -> _base, with `ways` allowed one door into
# `fire` for `_consume` -- the rift under a walker burns the pocket by the
# same rule the fields burn by.
[[tool.importlinter.contracts]]
name = "The planet's floor asks nobody above it"
type = "forbidden"
source_modules = ["src.engine.plates._base"]
forbidden_modules = [
    "src.engine.plates.clock",
    "src.engine.plates.fire",
    "src.engine.plates.ways",
    "src.engine.plates.veins",
]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "The fire knows nothing of the clock, the ways or the veins"
type = "forbidden"
source_modules = ["src.engine.plates.fire"]
forbidden_modules = [
    "src.engine.plates.clock",
    "src.engine.plates.ways",
    "src.engine.plates.veins",
]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "The ways burn through the fire's one door and never ring the clock"
type = "forbidden"
source_modules = ["src.engine.plates.ways"]
forbidden_modules = ["src.engine.plates.clock", "src.engine.plates.veins"]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "The veins move on the floor alone"
type = "forbidden"
source_modules = ["src.engine.plates.veins"]
forbidden_modules = [
    "src.engine.plates.clock",
    "src.engine.plates.fire",
    "src.engine.plates.ways",
]
allow_indirect_imports = "true"
