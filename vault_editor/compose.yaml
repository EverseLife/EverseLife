# Редактор рецептов. Запуск из корня репозитория:
#
#   docker compose -f vault_editor/compose.yaml up --build
#
# Открыть http://127.0.0.1:8765
#
# Правки идут прямо в файл вольта на диске: `/vault` — это bind mount, а не
# копия. Контейнер пишет в тот же `data/recipes.yaml`, который лежит рядом с
# репозиторием, и git видит правку сразу.

services:
  vault-editor:
    build:
      context: .
    image: octoverse-vault-editor
    ports:
      # Только петля хоста: инструмент пишет в файлы, наружу ему незачем.
      - "127.0.0.1:8765:8765"
    volumes:
      # Вольт гейм-дизайна. Путь переопределяется переменной OCTOVERSE_VAULT.
      - ${OCTOVERSE_VAULT:-../../octoverse-game-design}:/vault
      # Скрипт синхронизации и слепок, который он обновляет. Кнопка
      # «Синхронизировать» запускает тот же `deploy/sync-vault.py`, что и
      # человек руками, поэтому он приезжает томом, а не копией в образе.
      - ../deploy:/repo/deploy:ro
      - ../vault:/repo/vault
      # Бэкапы переживают пересоздание контейнера — иначе «Отменить правку»
      # забывала бы всё при каждом `up`.
      - ./backups:/backups
    # На Linux раскомментируйте, иначе файлы вольта станут принадлежать root:
    # user: "${UID:-1000}:${GID:-1000}"
    stop_grace_period: 2s
