          - {name: Кислород, kind: material, inputs: [Вода, Энергия], station: Электролизёр, highlight: [Энергия]}
          - {name: Окислитель, kind: material, inputs: [Селитра, Энергия], station: Электролизёр, highlight: [Селитра]}
          - {name: Ракетное топливо, kind: consumable, key: true, mix: true, inputs: [Спирт, Окислитель], station: Мастерская}
      - id: hull
        title: Двигатель и корпус
        recipes:
          - {name: Обшивка, kind: material, mix: true, inputs: [Сталь, Никель], station: Прокатный стан, highlight: [Никель]}
          - {name: Теплозащитные плиты, kind: material, mix: true, inputs: [Глина, Известь], station: Высокая печь}
          - {name: Баллон высокого давления, kind: material, inputs: [Сталь, Никель], amounts: {Сталь: 2, Никель: 1}, station: Прокатный стан}
          - {name: Камера сгорания, kind: material, inputs: [Сталь, Никель, Точная деталь], station: Токарный станок}
          - {name: Насос, kind: material, inputs: [Точная деталь, Сталь, Привод], station: Токарный станок}
          # Двигатель — рабочая станция, а не деталь корабля (D-202): его
          # ставят в узел борта тем же действием, что верстак в мастерскую, он
          # занимает площадь и весит. Тяга по классу — `ship.thrust`
          - {name: Двигатель I класса, kind: station, key: true, inputs: [Камера сгорания, Насос, Труба, Датчик], station: Космическая мастерская}
          - {name: Корпус, kind: material, key: true, inputs: [Стальная рама, Обшивка, Теплозащитные плиты], station: Космическая мастерская}
      - id: assembly
        title: Системы и сборка
        recipes:
          # Навигация и жизнеобеспечение — тоже станции в узлах борта (D-202):
          # что корабль умеет, задаётся тем, что в нём стоит, а не строкой в
          # рецепте корабля
          - {name: Навигационный блок, kind: station, inputs: [Процессорный блок, Датчик, Стекло], station: Чистая мастерская, highlight: [Процессорный блок]}
          - {name: Система жизнеобеспечения, kind: station, inputs: [Баллон высокого давления, Кислород, Труба, Датчик], station: Мастерская}
          - {name: Космическая мастерская, kind: station, inputs: [Кирпич, Сталь, Брус, Привод], station: Стройка}
          - {name: Космическая верфь, kind: station, inputs: [Раствор, Каменный блок, Сталь, Труба], station: Стройка}
          # Корабль собирается не рецептом, а по узлу за раз (D-201, D-202):
          # отдал основу на космической верфи — заложил основание, оно же коннектор;
          # отдал на борту — расширил корабль ещё одним узлом. Прежний рецепт
          # «Орбитальный корабль» отменён вместе с моделью «корабль — предмет»
          - {name: Основа узла корабля, kind: consumable, key: true, mass: 2000, inputs: [Корпус, Точная деталь, Провод], station: Космическая мастерская}

