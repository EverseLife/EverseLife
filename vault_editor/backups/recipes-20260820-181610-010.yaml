  - id: 11
    title: Космический корабль I класса
    short: корабль I класса
    sections:
      - id: fuel
        title: Химия и топливо
        recipes:
          - {name: Бродильный чан, kind: station, inputs: [Доски, Медь, Труба], station: Мастерская}
          - {name: Спирт, kind: material, mix: true, inputs: [Сахар, Вода], station: Бродильный чан}
