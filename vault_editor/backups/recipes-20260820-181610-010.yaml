# ЕДИНСТВЕННЫЙ ИСТОЧНИК списка рецептов MVP (D-052, D-054, D-057, D-060, D-084, D-090).
#
# Правится ТОЛЬКО здесь. Из этого файла генерируются:
#   20-systems/13-recipes-mvp.md — страница для чтения
#   build/recipes.json           — нормализованный список для движка
# Команда: python tools/build.py
#
# tools/build.py проверяет то, что документ обещает словами:
#   — нет циклов (верстак не требует гвоздей, которые делаются на верстаке)
#   — нет тупиков: материал обязан идти дальше в передел. Инструменты,
#     снаряжение, расходники, транспорт, монета и постройки конечны по типу
#   — каждая рабочая станция и вход существует как рецепт, операция или сырьё
#
# Формат записи:
#   name      — название предмета
#   inputs    — из чего делается
#   station   — на чём делается
#   kind      — тип рецепта, определяет поведение предмета в движке (D-090):
#                 station    — рабочая станция и оборудование: ставится в здание и задаёт,
#                              чем это здание является (D-106). Отдельного типа
#                              «постройка» больше нет: здание универсально,
#                              его считает формула, а не рецепт
#                 tool       — инструмент: носится, изнашивается, теряется при смерти
#                 gear       — снаряжение и тара: носится, инструментом не является
#                 vehicle    — транспорт
#                 material   — материал и полуфабрикат: обязан идти дальше в передел
#                 consumable — расходник: еда, топливо, крепь, ремкомплект
#                 money      — монета: проба, клеймо, вес
#   mix       — true, если состав задан пропорцией, а не штуками (D-092).
#               Сплавы, стекло, растворы, химия, топливо. У сборок пропорций нет
#   amounts   — количества входов, ЗАДАННЫЕ ВРУЧНУЮ. Исключение (D-133):
#               по умолчанию количества выводятся из трудоёмкости сборкой.
#               Ставится только там, где расточительность осмысленна
#   weights   — доли бюджета труда между входами, если равного деления мало.
#               {Железная руда: 0.7, Уголь: 0.3}. Сумма приводится к единице
#   roles     — true, если inputs — это РОЛИ, а не точный состав (D-119).
#               Только у блюд: движок принимает в роль любой подходящий продукт,
#               а сочетание задаёт вид блюда и считается для разнообразия рациона
#   key       — true для вех лестницы; в тексте набирается жирным
#   highlight — входы, которые в тексте набраны жирным как узкое место ветки
#   hours     — собственное время изготовления единицы, ЗАДАННОЕ ВРУЧНУЮ.
#               Исключение того же рода, что и `amounts` (D-133): по умолчанию
#               время растёт от глубины передела. Заданное здесь идёт и в
#               трудоёмкость, и в количества входов — час работы съедает
#               `craft.input_labor_ratio` часов чужого труда, и удлинив шаг,
#               рецепт съедает больше

meta:
  decisions: [D-052, D-054, D-057, D-060, D-084, D-092, D-105, D-106, D-107, D-115, D-119, D-120]
  doc: 20-systems/13-recipes-mvp.md
  # Сырьё: берётся из мира руками или добычей. Ничем не изготавливается.
  raw:
    # Волокно больше не сырьё: его вьют изо льна (D-196). Сырьём стал сам
    # лён — его находят собирательством и растят на делянке
    - Лён
    - Дерево
    - Камень
    - Глина
    - Вода
    - Смола
    - Зерно
    - Солома
    - Овощи
    - Бобы
    - Масличные семена
    - Сахарный стебель
    - Целебные травы
    - Сено
    - Мясо
    - Известняк
    - Кварцевый песок
    - Песок
    - Органические отходы
    - Соль
    - Сера
    - Селитра
    # Порода, а не «руда вообще» (D-151): медный узел и железный — разные
    # места с разной ценностью, и за них по-разному дерутся
    - Железная руда
    - Медная руда
    - Оловянная руда
    - Свинцовая руда
    - Уголь
    - Вольфрам
    - Никель
    - Золотоносная порода
    - Серебряная порода
    - Энергия
    - Жила

  # Продукты: то, что идёт в котёл (D-119). Съедобные рецепты (food: true)
  # годятся сами по себе, этот список добавляет сырьё и полуфабрикаты.
  # Годность КОНКРЕТНОЙ роли — тоже содержание, но его пока нет:
  # продукт годится в любую роль, а кирка не годится никуда (16-cooking).
  edible:
    - Зерно
    - Овощи
    - Бобы
    - Мясо
    - Вода
    - Соль
    - Мука
    - Масло
    - Сахар
    - Целебные травы

  # Масса СЫРЬЯ, кг за единицу (D-146). Масса изделий НЕ ЗАДАЁТСЯ: она равна
  # массе того, что в него вошло, и выводится сборкой — тем же порядком, что
  # урожайность (D-136) и количества входов (D-133). Материя при переделе не
  # появляется и не исчезает, поэтому вторая таблица масс была бы вторым
  # источником истины.
  #
  # Числа — стартовые, правятся на живой игре (D-065). Ориентир: час добычи
  # руды даёт 60 кг при пределе носимого 30 — значит унести всё сразу нельзя,
  # и это ровно то, ради чего лимит существует.
  mass:
    Железная руда: 1.0
    Медная руда: 1.1
    Оловянная руда: 1.0
    Свинцовая руда: 1.4
    Уголь: 0.8
    Камень: 2.0
    Глина: 1.5
    Песок: 1.5
    Кварцевый песок: 1.5
    Известняк: 2.0
    Дерево: 3.0
    Волокно: 0.2
    Лён: 0.3
    Смола: 0.5
    Вода: 1.0
    Зерно: 0.7
    Солома: 0.1
    Овощи: 0.8
    Бобы: 0.7
    Масличные семена: 0.5
    Сахарный стебель: 1.0
    Целебные травы: 0.1
    Сено: 0.2
    Мясо: 1.0
    Органические отходы: 0.5
    Соль: 1.0
    Сера: 1.0
    Селитра: 1.0
    Вольфрам: 2.5
    Никель: 2.2
    Золотоносная порода: 2.5
    Серебряная порода: 2.3
    # Продукты операций: их массу тоже задают руками — операция берёт материю
    # из мира либо дробит её, и выводить вес не из чего
    Бревно: 20.0
    Доски: 5.0
    Щебень: 2.0
    Крошка: 2.0
    Керамика: 2.0
    Слиток железа: 5.0
    Медный слиток: 5.0
    Олово: 5.0
    Свинец: 6.0
    # Энергия невесома по определению: она либо в пуле, либо в аккумуляторе,
    # и вес есть у аккумулятора, а не у заряда (D-071)
    Энергия: 0
    # «Жила» — не предмет, а требование механики добычи
    Жила: 0

  # Весовое: сыпучее, наливное и всё, что меряют весом, а не считают штуками
  # (D-212). Количество такой вещи бывает дробным — полкило руды осмысленно.
  # Всё, чего в списке нет, штучное: количество всегда целое, и половины
  # слитка не бывает. Новая вещь по умолчанию штучная — весовую называют здесь.
  # Вывод количеств это соблюдает сам — штучный вход округляется до целого, —
  # а заданное `amounts` руками проверяется: дробь у штучного роняет проверку.
  bulk:
    # Порода и то, что из неё дробится
    - Железная руда
    - Медная руда
    - Оловянная руда
    - Свинцовая руда
    - Золотоносная порода
    - Серебряная порода
    - Вольфрам
    - Никель
    - Уголь
    - Камень
    - Известняк
    - Известь
    - Глина
    - Песок
    - Кварцевый песок
    - Щебень
    - Крошка
    - Кремний
    # Аффинаж меряют граммами: монету считают штуками, металл в ней — нет
    - Аффинированное золото
    - Аффинированное серебро
    # Жидкое и газообразное
    - Вода
    - Смола
    - Масло
    - Спирт
    - Серная кислота
    - Раствор
    - Кислород
    - Окислитель
    - Ракетное топливо
    # Земля и то, что с неё берут: урожай меряют весом, а не колосьями
    - Зерно
    - Мука
    - Сахар
    - Овощи
    - Бобы
    - Мясо
    - Масличные семена
    - Сахарный стебель
    - Целебные травы
    - Солома
    - Сено
    - Лён
    - Волокно
    - Соль
    - Сера
    - Селитра
    - Органические отходы
    - Компост
    - Минеральное удобрение
    - Корм
    - Сталь
    - Слиток железа

  # Единица измерения — то, что дорисовывается рядом с числом: «5 шт», «3 м».
  # Ни на что в движке не влияет: дробное количество или целое решает `bulk`
  # выше, а здесь только слово для игрока. Не названо — счётным вещам пишется
  # «шт.», весовым не пишется ничего.
  units: {}

  # Слоты снаряжения (D-146). В каждый надевается одна вещь: без слота игрок
  # надел бы три рюкзака, и предел носимого перестал бы существовать.
  # Сколько килограммов добавляет надетое — `inventory.carry_bonus`.
  gear_slots:
    - спина
    - тело
    - каркас

  # Разговорное имя, которым текст пользуется, -> точное название
  synonyms:
    Медь: Медный слиток
    Железо: Слиток железа
    Печь: Плавильная печь

  # Класс инструмента -> чем его можно закрыть. Годится любой из списка
  tool_classes:
    Кирка: [Каменная кирка, Железная кирка, Стальная кирка]
    Топор: [Каменный топор, Топор]
    Утварь: [Глиняный горшок, Котёл]

# Расхождения, о которых мы знаем и по которым ещё нет решения.
# Проверка их показывает, но сборку не роняет. Каждое обязано ссылаться на OQ.
# Пусто: стартовый тупик OQ-079 закрыт бревном (D-084).
# Проверка это не ловит — она следит за связностью того, что есть,
# а не за полнотой того, что обещано другими документами.
known_issues: []

# Операции: то, что делается без рецепта.
#
#   requires — чем операция закрывается. Инструмент, рабочая станция, жила. НЕ расходуется
#   gives    — что даёт
#   consumes — что расходуется на единицу выхода. Пусто у добывающих операций:
#              рубка и добыча берут материю из мира, а не из другого предмета
#   weights  — доли бюджета труда между расходуемым, если равного деления мало
#   amounts  — количества, ЗАДАННЫЕ ВРУЧНУЮ: {выход: {вход: сколько}}. Исключение
#   yield    — {выход: сколько}. Сколько единиц выхода даёт ОДНА единица входа.
#              Для переделов, где выход мельче входа: бревно распускается на
#              несколько досок, и «сколько бревна на доску» — неестественная
#              форма записи. Задаёт количества напрямую: вход = 1 / yield
#
# Количества и время выводятся, а не задаются (D-133). Собственное время
# операции на единицу выхода — это `1 / harvest.rates[выход]`: там уже лежит
# темп по каждому из девяти продуктов операций. Дальше работает то же правило,
# что у рецептов: час работы съедает `craft.input_labor_ratio` часов чужого труда.
operations:
  # Бревно падает с дерева вместе с дровами: ранняя древесина не требует
  # стального инструмента, иначе лестница не проходится с нуля (D-084)
  # place — свойство узла, где операция возможна (D-177): рубят там, где лес
  - {name: Рубка дерева, requires: [Топор], gives: [Дерево, Бревно], consumes: [], place: лес}
  # Подножного сбора операциями больше нет (D-196 → D-210): камень, дерево и
  # лён находят собирательством на пустой земле — таблица `forage.finds`.
  # Круг «топор из дерева, дерево из топора» размыкается там же
  # Распил — единственный передел, где выход мельче входа. Вывод из трудоёмкости
  # давал 0.6 бревна на доску, а пол «меньше единицы не бывает» выкручивал это
  # в 1.0, и бревно давало ровно одну доску. Число 5 — ПРОБНОЕ, ручка выхода
  # древесины: им регулируется, насколько дефицитны доски на старте
  - {name: Распил, requires: [Пила], gives: [Доски], consumes: [Бревно], yield: {Доски: 5}}
  # Выходы перечисляют ВСЕ породы с темпом в harvest.rates (D-186): золото,
  # серебро, вольфрам и никель были объявлены сырьём, но не добывались ничем —
  # аффинаж и монета оказывались недостижимы. Редкость задаёт темп, а не
  # отсутствие в списке: золото добывается медленнее всех и находится реже
  - {name: Добыча, requires: [Кирка, Жила],
     gives: [Железная руда, Медная руда, Оловянная руда, Свинцовая руда, Камень, Уголь,
             Золотоносная порода, Серебряная порода, Вольфрам, Никель],
     consumes: []}
  - {name: Дробление, requires: [Молот], gives: [Щебень, Крошка], consumes: [Камень]}
  # Уголь здесь топливо и потому расходуется, а не «требуется»: печь остаётся,
  # уголь сгорает. Руда до этого нигде не значилась входом — плавка была
  # единственным переделом, у которого не было сказано, из чего он делает металл.
  # Вес 0.8/0.2: топливо не стоит половины плавки, иначе руды и угля уходит
  # поровну и передел перестаёт читаться как обогащение (D-141).
  #
  # Плавок четыре, а не одна (D-151): у каждого металла своя порода, и «руды
  # вообще» в мире нет. Одна операция на четыре выхода означала бы, что в
  # каждый металл идут все четыре породы разом
  - {name: Плавка железа, requires: [Печь], gives: [Слиток железа],
     consumes: [Железная руда, Уголь], weights: {Железная руда: 0.8, Уголь: 0.2}}
  - {name: Плавка меди, requires: [Печь], gives: [Медный слиток],
     consumes: [Медная руда, Уголь], weights: {Медная руда: 0.8, Уголь: 0.2}}
  - {name: Плавка олова, requires: [Печь], gives: [Олово],
     consumes: [Оловянная руда, Уголь], weights: {Оловянная руда: 0.8, Уголь: 0.2}}
  - {name: Плавка свинца, requires: [Печь], gives: [Свинец],
     consumes: [Свинцовая руда, Уголь], weights: {Свинцовая руда: 0.8, Уголь: 0.2}}
  - {name: Обжиг, requires: [Печь], gives: [Керамика], consumes: [Глина]}

levels:
  - id: 1
    title: Примитивы — руками, без станции
    short: примитивы
    recipes:
      # Руками делается только то, что действительно делается руками в поле:
      # связать, обмотать, слепить. Всё, что требует опоры и стола, — на
      # верстаке; сам верстак — единственная станция, собираемая без станции
      # Волокно вьют изо льна руками (D-196): без этого шага верёвка,
      # а с ней и первый топор, брались из ниоткуда
      - {name: Волокно, kind: material, inputs: [Лён], station: Руками}
      - {name: Верёвка, kind: material, inputs: [Волокно], station: Руками}
      - {name: Каменный топор, kind: tool, inputs: [Камень, Дерево, Верёвка], station: Руками}
      # Составы на одной станции не совпадают (D-209): изобретение узнаёт рецепт
      # по составу с количествами, и двух рецептов с одним составом быть не может.
      # Там, где выведенные количества совпали, вторая вещь получает свои руками
      - {name: Каменная кирка, kind: tool, inputs: [Камень, Дерево, Верёвка], amounts: {Камень: 12, Дерево: 5, Верёвка: 1}, station: Руками}
      - {name: Корзина, kind: gear, slot: спина, inputs: [Волокно], amounts: {Волокно: 2}, station: Руками}
      - {name: Глиняный горшок, kind: tool, inputs: [Глина], station: Руками, note: "утварь, обжиг"}

  - id: 2
    title: Верстак и дерево
    short: верстак и дерево
    recipes:
      # Верстак — начало лестницы рабочих станций: он один собирается руками,
      # а все прочие требуют верстака либо станции глубже (D-106)
      - {name: Верстак, kind: station, inputs: [Бревно, Верёвка], station: Руками}
      - {name: Плавильная печь, kind: station, inputs: [Камень, Глина], station: Верстак}
      - {name: Очаг, kind: station, inputs: [Камень, Глина], amounts: {Камень: 3, Глина: 4}, station: Верстак, note: готовка}
      - {name: Брус, kind: material, inputs: [Дерево], station: Верстак}
      - {name: Рукоять, kind: material, inputs: [Дерево], amounts: {Дерево: 3}, station: Верстак}
      - {name: Ткань, kind: material, inputs: [Волокно], station: Верстак}
      - {name: Мешок, kind: gear, slot: спина, inputs: [Ткань, Верёвка], station: Верстак}
      - {name: Простой рюкзак, kind: gear, slot: спина, mass: 2, inputs: [Ткань, Верёвка], amounts: {Ткань: 25, Верёвка: 10}, station: Верстак, note: носимое}
      - {name: Ведро, kind: gear, inputs: [Доски, Верёвка], station: Верстак}
      - {name: Бочка, kind: gear, inputs: [Доски, Верёвка], amounts: {Доски: 12, Верёвка: 2}, station: Верстак}
      - {name: Шахтная крепь, kind: consumable, key: true, inputs: [Брус, Верёвка], station: Верстак}
      - {name: Тачка, kind: vehicle, inputs: [Доски, Брус, Верёвка], station: Верстак}
      # Кровать и стеллаж — мебель, а не рабочие станции: на них не работают, они
      # обустраивают здание (гибернация, хранение)
      - {name: Кровать, kind: furniture, inputs: [Брус, Ткань, Верёвка], amounts: {Брус: 2, Ткань: 2, Верёвка: 1}, station: Верстак, note: гибернация}
      # store — вместимость хранилища в килограммах (D-181). Ею мебель и
